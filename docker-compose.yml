version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: hungcuong
      MYSQL_DATABASE: huongcungbookstore
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql
    networks:
      - platform-network
    command: --bind-address=0.0.0.0 --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-phungcuong"]
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: hungcuong
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - platform-network

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: hungcuong
      MINIO_ROOT_PASSWORD: 12345678
    ports:
      # API port
      - "9000:9000"
      # Console/UI port
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - platform-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  solr:
    image: solr:9.7
    container_name: solr
    ports:
      - "8983:8983"
    volumes:
      - solr-data:/var/solr
      - ./Platform/src/main/resources/solr/books:/opt/solr-config:ro
    networks:
      - platform-network
    environment:
      SOLR_HEAP: 512m
      SOLR_CORE_NAME: ${SOLR_CORE_NAME:-books}
    command:
      - bash
      - -c
      - |
        # Create core with default config first (if it doesn't exist)
        if [ ! -d "/var/solr/data/${SOLR_CORE_NAME:-books}" ]; then
          docker-entrypoint.sh solr-precreate ${SOLR_CORE_NAME:-books}
        fi
        
        # Copy custom config files
        echo "Copying custom schema and config..."
        cp -r /opt/solr-config/* /var/solr/data/${SOLR_CORE_NAME:-books}/conf/
        
        # Start Solr
        exec docker-entrypoint.sh solr-foreground
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8983/solr/admin/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - platform-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

