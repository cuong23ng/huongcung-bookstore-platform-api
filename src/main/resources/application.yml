#   Database Configuration
# Note: If you encounter foreign key constraint errors, the DatabaseCleanupConfig
# component will automatically clean up orphaned data on startup.
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    driver-class-name: ${JDBC_DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
    url: jdbc:mysql://${JDBC_DATABASE_HOST:}:${JDBC_DATABASE_PORT:}/${JDBC_DATABASE_NAME:}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${JDBC_DATABASE_USERNAME:}
    password: ${JDBC_DATABASE_PASSWORD:}
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour in milliseconds
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "bookstore:cache:"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:huongcungbookstore@gmail.com}
    password: ${SMTP_PASSWORD:app-password-cua-ban} # Dùng App Password, không phải mật khẩu login thường
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
  ai:
    google:
      genai:
        api-key: ${GOOGLE_AI_API_KEY}
        chat:
          options:
            model: ${GOOGLE_AI_MODEL:gemini-1.5-flash-001}

# Server Configuration
server:
  port: 8082
  # Uncomment below for HTTPS (requires SSL certificate)
  # ssl:
  #   enabled: true
  #   key-store: classpath:keystore.p12
  #   key-store-password: password
  #   key-store-type: PKCS12

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:myVerySecureSecretKeyForJWTTokenGenerationThatIsLongEnoughForHS512AlgorithmAndContainsAtLeast64Characters}
  expiration: ${JWT_EXPIRATION:86400000}

# MinIO S3
s3:
  endpoint: ${S3_ENDPOINT}
  bucket: ${S3_BUCKET}
  accessKey: ${S3_ACCESS_KEY}
  secretKey: ${S3_SECRET_KEY}

# Solr Configuration
solr:
  host: ${SOLR_HOST:localhost}
  port: ${SOLR_PORT:8983}
  core: ${SOLR_CORE_NAME:books}
  connection-timeout: 5000
  socket-timeout: 10000
  indexing:
    batch-size: ${SOLR_INDEXING_BATCH_SIZE:1000}
    enabled: ${SOLR_INDEXING_ENABLED:true}
    retry:
      max-attempts: ${SOLR_INDEXING_RETRY_MAX_ATTEMPTS:3}
      delay-ms: ${SOLR_INDEXING_RETRY_DELAY_MS:1000}

# GHN API Configuration
ghn:
  api-token: ${GHN_API_TOKEN}
  base-url: ${GHN_BASE_URL}
  shop-id: ${GHN_SHOP_ID:}
  client-id: ${GHN_CLIENT_ID:}
  timeout: ${GHN_TIMEOUT:10000}
  retry-max-attempts: ${GHN_RETRY_MAX_ATTEMPTS:3}
  retry-delay-ms: ${GHN_RETRY_DELAY_MS:1000}


payment:
  vnpay:
    url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    # Return URL after payment - should point to /payment/success route
    # Example: https://front-end.huongcungbookstore.com/payment/success
    return-url: ${VNPAY_RETURN_URL:https://front-end.huongcungbookstore.com/payment/success}
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction